<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner Pro - Etiquetas Mercado Libre</title>
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { max-width: 500px; margin: 0 auto; padding: 12px; background-color: #f4f6f9; color: #333; }
    h2 { text-align: center; color: #2D3277; margin: 8px 0 15px 0; font-size: 1.3rem; }
    
    .scanner-overlay {
      position: relative; background: #000; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); height: 200px;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }
    .scanner-line {
      position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
      background-color: #ff5252; box-shadow: 0 0 12px #ff5252;
      animation: scan 1.5s infinite alternate ease-in-out;
    }
    @keyframes scan { from { top: 20%; } to { top: 80%; } }

    .quick-actions { display: flex; gap: 8px; margin: 12px 0; }
    .btn {
      flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold;
      font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-main { background: #2D3277; color: white; }
    .btn-torch { background: #ffe600; color: #000; }
    .btn-csv { background: #2e7d32; color: white; }
    .btn-copy { background: #0288d1; color: white; }
    .btn-danger { background: #d32f2f; color: white; }

    .status {
      text-align: center; font-weight: bold; min-height: 22px; font-size: 0.9rem;
      padding: 6px; border-radius: 6px; margin: 8px 0;
    }

    .counter-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: bold;
    }
    .badge { background: #FFE600; padding: 4px 10px; border-radius: 20px; color: #2D3277; }

    input[type="text"] {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px;
    }

    ul { list-style: none; padding: 0; margin: 0; background: white; border-radius: 8px; max-height: 250px; overflow-y: auto; }
    li {
      padding: 10px 12px; border-bottom: 1px solid #eee; display: flex;
      justify-content: space-between; align-items: center; font-family: monospace; font-size: 0.95rem;
    }
    .delete-item { color: #d32f2f; cursor: pointer; font-weight: bold; padding: 2px 8px; }
  </style>
</head>
<body>

  <h2>Escáner Etiquetas ML</h2>

  <div class="scanner-overlay">
    <video id="video"></video>
    <div class="scanner-line"></div>
  </div>

  <div class="quick-actions">
    <button id="torchBtn" class="btn btn-torch" onclick="toggleTorch()"> Flash</button>
    <button class="btn btn-copy" onclick="copiarAlPortapapeles()"> Copiar</button>
    <button class="btn btn-csv" onclick="exportarCSV()"> CSV</button>
    <button class="btn btn-danger" onclick="limpiarLista()"> Borrar</button>
  </div>

  <div id="status" class="status"></div>

  <div class="counter-bar">
    <span>Escaneados:</span>
    <span id="count" class="badge">0</span>
  </div>

  <input type="text" id="search" placeholder="Buscar ID escaneado..." onkeyup="filtrarLista()">

  <ul id="lista-ids"></ul>

  <script>
    let codeReader;
    let selectedDeviceId;
    let currentStreamTrack;
    let torchOn = false;
    const idsGuardados = JSON.parse(localStorage.getItem('ml-ids')) || [];

    // Web Audio API para sonido de bip instantáneo
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 800, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
    }

    window.addEventListener('load', function () {
      codeReader = new ZXing.BrowserMultiFormatReader();
      actualizarLista();

      codeReader.listVideoInputDevices().then((devices) => {
        const backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('trasera')) || devices[0];
        selectedDeviceId = backCamera.deviceId;
        startScanning();
      }).catch(err => console.error(err));
    });

    function startScanning() {
      codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
        if (result) procesarId(result.text);
      });
      setTimeout(() => {
        const videoEl = document.getElementById('video');
        if (videoEl.srcObject) currentStreamTrack = videoEl.srcObject.getVideoTracks()[0];
      }, 1000);
    }

    function procesarId(texto) {
      const regexValida = /^\d{10,14}$/;
      const coincide = texto.match(regexValida);
      
      if (coincide) {
        const id = coincide[0];
        if (!idsGuardados.includes(id)) {
          idsGuardados.push(id);
          actualizarLista();
          playBeep(1000);
          if (navigator.vibrate) navigator.vibrate(80);
          mostrarEstado(`¡Guardado!: ${id}`, '#e8f5e9', '#2e7d32');
        } else {
          playBeep(300, 'square');
          mostrarEstado(`Duplicado: ${id}`, '#fff3e0', '#ef6c00');
        }
      }
    }

    function actualizarLista() {
      localStorage.setItem('ml-ids', JSON.stringify(idsGuardados));
      document.getElementById('count').textContent = idsGuardados.length;
      filtrarLista();
    }

    function borrarItem(index) {
      idsGuardados.splice(index, 1);
      actualizarLista();
    }

    function filtrarLista() {
      const query = document.getElementById('search').value.toLowerCase();
      const listaEl = document.getElementById('lista-ids');
      listaEl.innerHTML = '';

      idsGuardados.slice().reverse().forEach((id, idx) => {
        const originalIndex = idsGuardados.length - 1 - idx;
        if (id.toLowerCase().includes(query)) {
          const li = document.createElement('li');
          li.innerHTML = `<span>#${originalIndex + 1} - <b>${id}</b></span> <span class="delete-item" onclick="borrarItem(${originalIndex})">✕</span>`;
          listaEl.appendChild(li);
        }
      });
    }

    function toggleTorch() {
      if (currentStreamTrack && currentStreamTrack.getCapabilities().torch) {
        torchOn = !torchOn;
        currentStreamTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
      } else {
        alert('Flash no soportado en esta cámara/navegador');
      }
    }

    function copiarAlPortapapeles() {
      if (!idsGuardados.length) return;
      navigator.clipboard.writeText(idsGuardados.join('\n'));
      mostrarEstado('¡Copiado al portapapeles!', '#e1f5fe', '#0288d1');
    }

    function exportarCSV() {
      if (!idsGuardados.length) return alert('Lista vacía');
      const csv = "data:text/csv;charset=utf-8,ID_MercadoLibre\n" + idsGuardados.join("\n");
      const a = document.createElement("a");
      a.href = encodeURI(csv);
      a.download = `etiquetas_ml_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function limpiarLista() {
      if (idsGuardados.length && confirm('¿Borrar toda la lista?')) {
        idsGuardados.length = 0;
        actualizarLista();
      }
    }

    function mostrarEstado(msg, bg, color) {
      const el = document.getElementById('status');
      el.textContent = msg; el.style.backgroundColor = bg; el.style.color = color;
      setTimeout(() => { el.textContent = ''; el.style.backgroundColor = 'transparent'; }, 2000);
    }
  </script>
</body>
</html>
